<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>पढ़ के बताओ · Padh Ke Batao</title>
<script>
  // Set theme before first paint so dark mode never flashes white.
  (() => {
    let saved = null;
    try { saved = localStorage.getItem('theme'); } catch {}
    const dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  })();
</script>
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<main>
  <header>
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
          <rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>
        </svg>
      </span>
      <h1 data-t="title"></h1>
    </div>
    <div class="controls">
      <button type="button" class="theme" id="theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path id="themeIcon"/>
        </svg>
        <span id="themeLabel"></span>
      </button>
      <div class="lang" role="group" aria-label="Language / भाषा">
        <button type="button" data-lang="hi" aria-pressed="true">हिंदी</button>
        <button type="button" data-lang="en" aria-pressed="false">English</button>
      </div>
    </div>
  </header>
  <p class="privacy">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
      <rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>
    </svg>
    <span data-t="privacy"></span>
  </p>

  <button type="button" class="pick" id="pick">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <path d="M4 7h3l2-3h6l2 3h3a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1z"/>
      <circle cx="12" cy="13" r="4"/>
    </svg>
    <span data-t="pick"></span>
    <span class="hint" data-t="pickHint"></span>
  </button>
  <input type="file" id="file" accept="image/*">

  <ol class="steps" id="steps">
    <li><b>1</b><span data-t="step1"></span></li>
    <li><b>2</b><span data-t="step2"></span></li>
    <li><b>3</b><span data-t="step3"></span></li>
  </ol>

  <section class="card" id="progress" hidden aria-live="polite">
    <div class="preview">
      <img id="thumb" alt="">
      <div style="flex:1">
        <p class="status" id="status"></p>
        <div class="bar"><div id="bar"></div></div>
        <p class="elapsed" id="elapsed"></p>
      </div>
    </div>
  </section>

  <section class="card error" id="error" hidden role="alert">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <circle cx="12" cy="12" r="10"/><path d="M12 7v6M12 17h.01"/>
    </svg>
    <span id="errorText"></span>
  </section>

  <section class="card result" id="result" hidden aria-live="polite">
    <div class="result-head">
      <span class="badge" id="urgency"></span>
      <p class="doc-type" id="docType"></p>
    </div>
    <button type="button" class="listen" id="listen" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true">
        <path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/>
      </svg>
      <span id="listenLabel"></span>
    </button>
    <p class="voice-note" id="voiceNote" hidden data-t="voiceMissing"></p>
    <p class="voice-note" id="ttsNote" hidden data-t="ttsPrivacy"></p>
    <div class="deadline" id="deadline" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>
      </svg>
      <div id="deadlineText"></div>
    </div>
    <h2>
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/>
      </svg>
      <span data-t="whatSays"></span>
    </h2>
    <p class="summary" id="summary"></p>
    <h2>
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
      </svg>
      <span data-t="whatToDo"></span>
    </h2>
    <p class="action" id="action"></p>
    <h2>
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>
      </svg>
      <span data-t="details"></span>
    </h2>
    <ul class="details" id="details"></ul>
    <p class="note" id="note"></p>
  </section>

  <button type="button" class="again" id="again" hidden>
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <path d="M3 12a9 9 0 0 1 15.5-6.2L21 8M21 3v5h-5M21 12a9 9 0 0 1-15.5 6.2L3 16M3 21v-5h5"/>
    </svg>
    <span data-t="again"></span>
  </button>
</main>

<script type="module" src="/js/app.js"></script>
</body>
</html>
